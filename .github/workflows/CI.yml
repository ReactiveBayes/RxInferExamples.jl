name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [review_requested, reopened, synchronize]
  push:
    branches:
      - "main"
    tags: ["*"]
  check_run:
    types: [rerequested]
  schedule:
    - cron: "0 8 * * 1" # Run at 8:00 AM UTC every Monday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  actions: write
  contents: read

jobs:
  examples:
    name: Examples (Julia - ${{ matrix.version }})
    runs-on: ubuntu-latest
    # Set maximum runtime for this job to 90 minutes
    timeout-minutes: 90
    strategy:
      matrix:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # Build examples with strict environment checking (fails when env
      # variables are missing)
      - name: Build examples
        env:
          JULIA_FASTCHOLESKY_THROW_ERROR_NON_SYMMETRIC: 1
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          julia -e 'using Pkg; Pkg.add("Weave"); Pkg.precompile()'
          make examples-setup
          make examples STRICT_ENV=true
      # Upload examples as artifacts
      - uses: actions/upload-artifact@v7
        # Only upload from the latest Julia version
        if: matrix.version == '1.12'
        with:
          name: examples-output-${{ github.run_id }}
          path: |
            docs/src/categories/
            docs/src/autogenerated/
          retention-days: 1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # Set maximum runtime for this job to 15 minutes
    timeout-minutes: 15
    needs: examples
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
      - uses: julia-actions/cache@v3
      # `docs/make.jl` builds with `prerender=true`, which shells out to `node`
      # for syntax highlighting at build time. Pin it explicitly instead of
      # relying on whatever the runner image happens to ship - the build errors
      # out in CI without it.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Download the examples artifacts
      - uses: actions/download-artifact@v8
        with:
          name: examples-output-${{ github.run_id }}
          path: docs/src/
      - name: Build documentation
        run: |
          make docs-setup
          make docs
        env:
          # `docs/make.jl` calls deploydocs() at the end, so the credentials belong on
          # *this* step. Without them Documenter logs `Deploying: ✘` and returns
          # normally - a green build that publishes nothing. That is how the site went
          # stale for two days in August 2026. `docs/make.jl` now also asserts this.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_FASTCHOLESKY_THROW_ERROR_NON_SYMMETRIC: 1

      # Documenter typesets math with KaTeX in the reader's browser, so broken
      # LaTeX - or any script that throws before KaTeX runs - produces a green
      # build and a page full of raw `$...$`. These checks load the built pages
      # and assert they actually rendered.
      - name: Check the built site renders
        run: |
          npm install --prefix docs/tools
          npx --prefix docs/tools playwright install --with-deps chromium
          make docs-check
